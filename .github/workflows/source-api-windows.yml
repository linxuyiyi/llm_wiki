name: LLM Wiki HTTP MCP + Source API Windows Build

on:
  push:
    branches:
      - feature/auto-http-mcp
      - fix/auto-http-mcp-startup
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install protoc
        shell: powershell
        run: choco install protoc -y --no-progress

      - name: Install dependencies
        shell: powershell
        run: |
          npm ci
          npm --prefix mcp-server ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Frontend unit tests
        run: npm run test:mocks

      - name: MCP tests
        shell: powershell
        run: |
          npm --prefix mcp-server run build
          $tests = Get-ChildItem -Path mcp-server/dist/test -Filter "*.test.js" -File | ForEach-Object { $_.FullName }
          if (-not $tests) {
            throw "No MCP test files were generated"
          }
          node --test $tests

      - name: HTTP MCP smoke test
        shell: powershell
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP "llm-wiki-mcp-http.out.log"
          $stderr = Join-Path $env:RUNNER_TEMP "llm-wiki-mcp-http.err.log"
          $proc = Start-Process node -ArgumentList @(
            "mcp-server/dist/src/index.js",
            "--transport", "http",
            "--host", "0.0.0.0"
          ) -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $health = $null
            for ($i = 0; $i -lt 40; $i++) {
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:19898/health" -TimeoutSec 2
                break
              } catch {
                Start-Sleep -Milliseconds 250
              }
            }
            if (-not $health) {
              Get-Content $stderr -ErrorAction SilentlyContinue
              throw "HTTP MCP health endpoint did not start"
            }
            if ($health.status -ne "ok") { throw "Unexpected HTTP MCP health status: $($health.status)" }
            if ($health.transport -ne "streamable-http") { throw "Unexpected transport: $($health.transport)" }
            if ($health.listenHost -ne "0.0.0.0") { throw "0.0.0.0 binding was not applied" }
            if ($health.localMcpUrl -ne "http://127.0.0.1:19898/mcp") { throw "Unexpected local MCP URL: $($health.localMcpUrl)" }
            Write-Host "HTTP MCP health check passed"
            $health | ConvertTo-Json -Depth 5
          }
          finally {
            if ($proc -and -not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force
            }
            if ($proc) {
              $errText = $proc.StandardError.ReadToEnd()
              if ($errText) { Write-Host $errText }
            }
          }

      - name: Rust Source API tests
        shell: powershell
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc api_server::tests::source_api
          cargo test --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc cors::tests
          cargo test --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc server_bind::tests
          cargo test --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc mcp_http::tests

      - name: Full Rust baseline tests
        continue-on-error: true
        run: cargo test --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Build MCP server
        run: npm run mcp:build

      - name: Verify bundled Node runtime staging
        shell: powershell
        run: |
          node scripts/prepare_mcp_runtime.mjs
          if (-not (Test-Path "mcp-server/runtime/node.exe")) {
            throw "Bundled MCP Node runtime was not staged"
          }
          & "mcp-server/runtime/node.exe" --version

      - name: Bundled HTTP MCP runtime smoke test
        shell: powershell
        run: |
          $root = Join-Path $env:RUNNER_TEMP "LLM Wiki MCP Runtime Test"
          $mcp = Join-Path $root "mcp-server"
          New-Item -ItemType Directory -Force -Path $mcp | Out-Null
          Copy-Item "mcp-server/dist" (Join-Path $mcp "dist") -Recurse -Force
          Copy-Item "mcp-server/node_modules" (Join-Path $mcp "node_modules") -Recurse -Force
          Copy-Item "mcp-server/package.json" (Join-Path $mcp "package.json") -Force
          Copy-Item "mcp-server/runtime" (Join-Path $mcp "runtime") -Recurse -Force

          $node = Join-Path $mcp "runtime/node.exe"
          $entry = Join-Path $mcp "dist/src/index.js"
          $stdout = Join-Path $root "stdout.log"
          $stderr = Join-Path $root "stderr.log"

          $psi = [System.Diagnostics.ProcessStartInfo]::new()
          $psi.FileName = $node
          $psi.UseShellExecute = $false
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $psi.CreateNoWindow = $true
          $psi.ArgumentList.Add($entry)
          $psi.ArgumentList.Add("--transport")
          $psi.ArgumentList.Add("http")
          $psi.ArgumentList.Add("--host")
          $psi.ArgumentList.Add("127.0.0.1")
          $psi.ArgumentList.Add("--port")
          $psi.ArgumentList.Add("19899")

          $proc = [System.Diagnostics.Process]::new()
          $proc.StartInfo = $psi
          if (-not $proc.Start()) { throw "Failed to start bundled HTTP MCP runtime" }

          try {
            $health = $null
            for ($i = 0; $i -lt 40; $i++) {
              if ($proc.HasExited) {
                $errText = $proc.StandardError.ReadToEnd()
                if ($errText) { Write-Host $errText }
                throw "Bundled HTTP MCP runtime exited early with code $($proc.ExitCode)"
              }
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:19899/health" -TimeoutSec 2
                break
              } catch {
                Start-Sleep -Milliseconds 250
                $proc.Refresh()
              }
            }
            if (-not $health) {
              Get-Content $stderr -ErrorAction SilentlyContinue
              throw "Bundled HTTP MCP runtime did not become healthy"
            }
            if ($health.status -ne "ok") { throw "Unexpected bundled HTTP MCP health status" }
            Write-Host "Bundled HTTP MCP runtime smoke test passed"
          }
          finally {
            if ($proc -and -not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force
            }
            Get-Content $stderr -ErrorAction SilentlyContinue
          }

      - name: Build Windows x64 NSIS installer
        run: npm run tauri build -- --bundles nsis --target x86_64-pc-windows-msvc

      - name: Collect installer and SHA256
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist-package | Out-Null
          $installer = Get-ChildItem -Path src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis -Filter "*-setup.exe" -File | Select-Object -First 1
          if (-not $installer) {
            throw "NSIS setup.exe was not generated"
          }
          $dest = "dist-package/LLM.Wiki_0.6.11_x64-setup.exe"
          Copy-Item $installer.FullName $dest -Force
          $hash = (Get-FileHash $dest -Algorithm SHA256).Hash
          $size = (Get-Item $dest).Length
          "file=$dest" | Out-File -FilePath dist-package/build-info.txt -Encoding utf8
          "size=$size" | Out-File -FilePath dist-package/build-info.txt -Append -Encoding utf8
          "sha256=$hash" | Out-File -FilePath dist-package/build-info.txt -Append -Encoding utf8
          Get-Content dist-package/build-info.txt

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: LLM.Wiki_0.6.11_x64-setup
          path: |
            dist-package/LLM.Wiki_0.6.11_x64-setup.exe
            dist-package/build-info.txt
          if-no-files-found: error
